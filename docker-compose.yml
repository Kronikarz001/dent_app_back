services:
  dent_app_back_nginx:
    image: nginx:alpine
    container_name: dent_app_back_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - dent_app_back_app
    networks:
      - dent_app_back_network
  dent_app_back_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dent_app_back_app
    container_name: dent_app_back_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - dent_app_back_db
    networks:
      - dent_app_back_network

  dent_app_back_db:
    image: postgres:15
    container_name: dent_app_back_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dent_db_back
      POSTGRES_USER: pskudlik
      POSTGRES_PASSWORD: Troll001#
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dent_app_back_network

volumes:
  dbdata:
    driver: local

networks:
  dent_app_back_network:
    driver: bridge
