services:
  dent_app_back_nginx:
    image: nginx:alpine
    container_name: dent_app_back_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "8000:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - dent_app_back_app
      - dent_app_back_reverb
    networks:
      - dent_app_back_network
  dent_app_back_app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dent_app_back_app
    container_name: dent_app_back_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - dent_app_back_db
    networks:
      - dent_app_back_network

  dent_app_back_reverb:
    image: dent_app_back_app
    container_name: dent_app_back_reverb
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - dent_app_back_app
    ports:
      - "8080:8080"
    networks:
      - dent_app_back_network
    entrypoint: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  dent_app_back_scheduler:
    image: dent_app_back_app
    container_name: dent_app_back_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - dent_app_back_app
    networks:
      - dent_app_back_network
    entrypoint: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]

  dent_app_back_db:
    image: postgres:15
    container_name: dent_app_back_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dent_db_back
      POSTGRES_USER: pskudlik
      POSTGRES_PASSWORD: Troll001#
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dent_app_back_network

volumes:
  dbdata:
    driver: local

networks:
  dent_app_back_network:
    driver: bridge
